[project]
name = "tiny-clinic"
version = "0.1.0"
description = "Offline referral and documentation support for community health workers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "pyyaml>=6.0.3",
    "tokenizers>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
